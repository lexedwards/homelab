name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r scripts/requirements-docs.txt
      - name: Check renderer startup with synthetic input
        run: |
          printf 'flowchart LR\n  A-->B\n' > "$RUNNER_TEMP/renderer-smoke.mmd"
          npm exec --yes --package=@mermaid-js/mermaid-cli@12.2.0 -- \
            mmdc -i "$RUNNER_TEMP/renderer-smoke.mmd" -o "$RUNNER_TEMP/renderer-smoke.svg"
      - run: make docs-test docs-check docs-render
