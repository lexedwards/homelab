apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-client-egress
spec:
  podSelector:
    matchLabels:
      policy-check-access: approved
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              policy-check-role: server
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-server-ingress
spec:
  podSelector:
    matchLabels:
      policy-check-role: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              policy-check-access: approved
      ports:
        - protocol: TCP
          port: 8080
