apiVersion: v1
kind: Namespace
metadata:
  name: secrets-check
  labels:
    homelab.io/qualification: secrets
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: secrets-check
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qualification-isolation
  namespace: secrets-check
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordinary
  namespace: secrets-check
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secrets-ordinary
  template:
    metadata:
      labels:
        app: secrets-ordinary
        homelab.io/qualification: secrets
    spec:
      serviceAccountName: reader
      automountServiceAccountToken: false
      nodeSelector:
        homelab.io/role: worker
        homelab.node-restriction.kubernetes.io/secrets-ready: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: secrets-ordinary
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: docker.io/library/python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
          command: [python3, -B, /app/reload.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: application
              mountPath: /app
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: qualification-files
        - name: application
          configMap:
            name: reload-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolated
  namespace: secrets-check
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secrets-isolated
  template:
    metadata:
      labels:
        app: secrets-isolated
        homelab.io/qualification: secrets
    spec:
      runtimeClassName: kata-clh-runtime-rs
      serviceAccountName: reader
      automountServiceAccountToken: false
      nodeSelector:
        homelab.io/role: worker
        homelab.node-restriction.kubernetes.io/secrets-ready: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: secrets-isolated
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: docker.io/library/python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
          command: [python3, -B, /app/reload.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: application
              mountPath: /app
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: qualification-files
        - name: application
          configMap:
            name: reload-app
