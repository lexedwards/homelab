apiVersion: v1
kind: Service
metadata:
  name: primary-ordinary
  namespace: policy-check
  labels:
    homelab.io/service-pool: primary
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  externalTrafficPolicy: Cluster
  allocateLoadBalancerNodePorts: false
  selector:
    app: server-ordinary
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
