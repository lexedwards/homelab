apiVersion: v1
kind: Namespace
metadata:
  name: nfs-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nfs-csi
  namespace: kube-system
spec:
  chart: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/v4.13.6/charts/v4.13.6/csi-driver-nfs-4.13.6.tgz
  targetNamespace: nfs-system
  createNamespace: false
  timeout: 10m
  failurePolicy: abort
  backOffLimit: 0
  valuesContent: |
    image:
      nfs:
        repository: registry.k8s.io/sig-storage/nfsplugin
        tag: v4.13.6@sha256:40663419bac36836b8e4ef6929199e35920e28f6a74a46892e1c125ea5f0ce0b
      csiProvisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.3.0@sha256:a4b0b1a37605b7b04a293e136edf7006ec1786a8eb3f4e5a945f81d667dcc371
      csiResizer:
        repository: registry.k8s.io/sig-storage/csi-resizer
        tag: v2.2.1@sha256:ea1d25e23479000c7e8eeb92d827df66258df4e482ca054c5e7ce3fc0f5c41a5
      livenessProbe:
        repository: registry.k8s.io/sig-storage/livenessprobe
        tag: v2.19.0@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
      nodeDriverRegistrar:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.17.0@sha256:f9de845b170155199f2a2a3f9531cf13d78e31235e9db6b6582a8b0db0a50dad
    driver:
      mountPermissions: 0
    feature:
      enableFSGroupPolicy: true
      fsGroupPolicy: None
      enableInlineVolume: false
      propagateHostMountOptions: false
    controller:
      replicas: 1
      runOnMaster: false
      runOnControlPlane: false
      nodeSelector:
        homelab.io/role: worker
      tolerations: []
      enableSnapshotter: false
      defaultOnDeletePolicy: retain
      logLevel: 2
    node:
      nodeSelector:
        homelab.io/role: worker
      maxUnavailable: 1
      logLevel: 2
    storageClass:
      create: false
    externalSnapshotter:
      enabled: false
      customResourceDefinitions:
        enabled: false
    volumeSnapshotClass:
      create: false
